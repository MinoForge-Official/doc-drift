<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#021c1a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="380" height="380" rx="36" fill="url(#docGrad)" stroke="#134e4a" stroke-width="3"/>
  <rect x="25" y="25" width="350" height="350" rx="26" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Document Silhouette -->
  <path d="M125,95 L225,95 L275,145 L275,295 L125,295 Z" fill="#042f2e" stroke="url(#glowGrad)" stroke-width="6" filter="url(#glow)"/>
  <path d="M225,95 L225,145 L275,145" fill="none" stroke="#2dd4bf" stroke-width="4"/>

  <!-- Code Lines -->
  <line x1="150" y1="165" x2="215" y2="165" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="195" x2="250" y2="195" stroke="#99f6e4" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="225" x2="195" y2="225" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>

  <!-- Big Green Verification Checkmark Badge -->
  <circle cx="250" cy="265" r="38" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <path d="M236,265 L246,275 L266,252" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Badge Label -->
  <rect x="135" y="38" width="130" height="24" rx="12" fill="#0d9488"/>
  <text x="200" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" text-anchor="middle">DOC-DRIFT</text>
</svg>
